
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reserva</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<style>
    :root{
        --blanco: #ffffff;
        --azul-oscuro: #0f2f52;
        --amarillo-suave:  #ffc933;
    }

    body {
        background-color: #f4f8fc;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* NAVBAR */
    .navbar{
        background-color: #ffffff !important;
        box-shadow: 0 2px 10px rgba(235, 232, 232, 0.339);
    }

    .logo-ulagos{
        width: 100px;
        height: 90px;
        object-fit: contain;
    }

    .brand-text{
        font-weight: 700;
        color: rgb(14, 12, 12);
        font-size: 1.3rem;
    }

    .navbar-brand {
        font-size: 1.4rem;
        color: rgb(10, 9, 9) !important;
    }

    .nav-link{
        color: rgb(13, 10, 10) !important;
        font-weight: 500;
    }

    .btn-reservas{
        background-color: var(--amarillo-suave);
        color: #231d0f;
        font-weight: 600;
        border: none;
        padding: 10px 18px;
        border-radius: 10px;
        transition: 0.3s;
    }

    .btn-reservas:hover{
        background-color: #f6d013;
        transform: translateY(-2px);
    }

    .btn-custom {
        background-color: #0d6efd;
        color: white;
        border: none;
        transition: 0.3s;
    }

    .btn-custom:hover {
        background-color: #0b5ed7;
        color: white;
    }

    .btn-outline-custom {
        border: 1px solid #0d6efd;
        color: #0d6efd;
        transition: 0.3s;
    }

    .btn-outline-custom:hover {
        background-color: #0d6efd;
        color: white;
    }

    /* TÍTULOS */
    .section-title {
        color: #0d6efd;
        font-weight: bold;
    }

    .section-subtitle {
        color: #6c757d;
    }

    /* CARDS */
    .menu-card {
        border: none;
        border-radius: 18px;
        overflow: hidden;
        transition: 0.3s ease;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
        background-color: white;
        height: 100%;
    }

    .menu-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.12);
    }

    .menu-img {
        height: 220px;
        object-fit: cover;
    }

    .badge-custom {
        background-color: #fff3cd;
        color: #856404;
        font-weight: 500;
        padding: 8px 12px;
        border-radius: 50px;
    }

    .price {
        color: #0d6efd;
        font-size: 1.2rem;
        font-weight: bold;
    }

    footer {
        background-color: white;
        border-top: 1px solid #dee2e6;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
        .menu-img {
            height: 200px;
        }

        .navbar .d-flex {
            flex-direction: column;
            width: 100%;
            margin-top: 15px;
        }

        .navbar .btn {
            width: 100%;
        }
    }
</style>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg sticky-top py-3">
        <div class="container">

            <!-- LOGO -->
            <a class="navbar-brand d-flex align-items-center gap-3" href="#">
                <img 
                   src="logo.ulagos/logo.ulagos.png" 
                    alt="Logo ULagos"
                    class="logo-ulagos"

                >

                <span class="brand-text">   
                    Cafetería ULagos
                </span>
            </a>

            <!-- BOTON MOBILE -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContenido">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- MENU -->
            <div class="collapse navbar-collapse" id="navbarContenido">

                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">

                    <li class="nav-item">
                        <a class="nav-link" href="#">Inicio</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Almuerzos</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Snacks</a>
                    </li>

                    <li class="nav-item">
                        <a href="#" class="btn btn-reservas">
                            <i class="bi bi-calendar-check"></i>
                            Mis Reservas
                        </a>
                    </li>

                </ul>

            </div>

        </div>
    </nav>


<div class="container py-5 text-center">
<div class="card p-5 mx-auto" style="max-width:600px">
<i class="bi bi-check-circle-fill text-success display-1"></i>
<h1 class="mt-4">Reserva Confirmada</h1>
<h2 class="fw-bold text-primary">ULG-93712</h2>
<p class="lead">Muestra este código al retirar tu pedido.</p>

<div class="row text-start mt-4">
<div class="col-md-6">
<p><strong>Producto:</strong> Menú 1</p>
<p><strong>Hora:</strong> 12:30</p>
</div>
<div class="col-md-6">
<p><strong>Estado:</strong> Confirmado</p>
<p><strong>Fecha:</strong> 24/05/2026</p>
</div>
</div>

<a href="reservas.html" class="btn btn-main mt-4">Ver Mis Reservas</a>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
